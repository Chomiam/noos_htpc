[package]
name = "noos-tv-dashboard"
version = "0.2.0"
edition = "2021"
authors = ["Chomiam <chomiam@users.noreply.github.com>"]
description = "Tableau de bord TV Wayland immersif pour Noos HTPC contrôlable à la manette"
license = "MIT"

[[bin]]
name = "noos-tv-dashboard"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2.2" }
